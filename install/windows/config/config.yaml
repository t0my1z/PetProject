# Chat Creator Configuration

connections:
  - name: "chat_connection"
    type: "UDP"
    endianness: "Little"
    host: "127.0.0.1"
    localport: 9990
    remoteport: 9991
    timeout: false
    frequency: 1
    inbuffersize: 1024
    outbuffersize: 1024

modules:
  - name: "chat_creator"
    communication_method: "CHAT"
    connections:
      - "chat_connection"
